<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>ParkSpot – delningskort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f4f6f9; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Inter',sans-serif; }
  /* 1200×630 = standard OG-format */
  .card {
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:linear-gradient(135deg,#ffffff 0%,#f7faf8 48%,#eef6f0 78%,#ffffff 100%);
    color:#0f172a; display:flex;
  }
  .glow { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 22% 70%, rgba(22,163,74,.07) 0%, transparent 55%),
               radial-gradient(ellipse at 85% 25%, rgba(56,189,248,.06) 0%, transparent 55%); }

  /* Vänster: text */
  .left { position:relative; z-index:2; width:660px; padding:64px 56px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:16px; margin-bottom:34px; }
  .logo { width:64px; height:64px; border-radius:18px; background:rgba(22,163,74,.10);
    border:1px solid rgba(22,163,74,.30); box-shadow:0 4px 16px rgba(22,163,74,.20);
    display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:800; color:#16a34a; }
  .brand-name { font-size:26px; font-weight:700; letter-spacing:-.01em; }
  .brand-sub  { font-size:15px; color:rgba(15,23,42,.55); margin-top:2px; }
  h1 { font-size:62px; line-height:1.04; font-weight:800; letter-spacing:-.02em; margin-bottom:24px; }
  h1 .accent { color:#16a34a; }
  .pills { display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap; }
  .pill { font-size:17px; font-weight:600; padding:10px 16px; border-radius:999px;
    background:rgba(15,23,42,.05); border:1px solid rgba(15,23,42,.12); }
  .pill .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  .sub { font-size:21px; line-height:1.5; color:rgba(15,23,42,.72); max-width:520px; }
  .foot { margin-top:auto; font-size:20px; font-weight:700; color:#16a34a; }

  /* Höger: stiliserad karta med färgade gator */
  .right { position:relative; flex:1; }
  .map { position:absolute; inset:0; background:#e9edf1;
    background-image:linear-gradient(rgba(15,23,42,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(15,23,42,.05) 1px,transparent 1px);
    background-size:46px 46px; }
  .map::before { content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,#ffffff 0%, transparent 22%); }
  svg { position:absolute; inset:0; width:100%; height:100%; }
  .pin { position:absolute; left:300px; top:300px; width:26px; height:26px; border-radius:50%;
    background:#ea4335; border:4px solid #fff; box-shadow:0 0 0 10px rgba(234,67,53,.20); }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>

    <div class="left">
      <div class="brand">
        <div class="logo">P</div>
        <div>
          <div class="brand-name">ParkSpot Stockholm</div>
          <div class="brand-sub">parkering på karta</div>
        </div>
      </div>

      <h1>Var får du <span class="accent">parkera?</span></h1>

      <div class="pills">
        <div class="pill"><span class="dot" style="background:#16a34a"></span>Nu</div>
        <div class="pill"><span class="dot" style="background:#16a34a"></span>Morgon</div>
        <div class="pill"><span class="dot" style="background:#16a34a"></span>Kväll</div>
        <div class="pill"><span class="dot" style="background:#16a34a"></span>Natt</div>
      </div>

      <div class="sub">Lagliga platser i Stockholm – utan städgator, förbud och böter. Vet på förhand, gissa inte.</div>

      <div class="foot">parkspot.se</div>
    </div>

    <div class="right">
      <div class="map"></div>
      <svg viewBox="0 0 540 630" preserveAspectRatio="none">
        <!-- gator i olika status-färger -->
        <path d="M-20,150 C120,120 220,210 360,180 540,150 560,150 560,150" stroke="#16a34a" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M40,640 C90,470 60,360 150,300 250,235 360,250 560,210" stroke="#16a34a" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M-20,360 C120,360 210,330 300,360 420,400 470,470 470,640" stroke="#38bdf8" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M150,300 C150,210 210,150 320,150" stroke="#38bdf8" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M300,360 C360,360 410,330 470,210" stroke="#ef4444" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M360,180 C420,180 470,210 470,260" stroke="#f59e0b" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="6 9"/>
      </svg>
      <div class="pin"></div>
    </div>
  </div>
</body>
</html>
