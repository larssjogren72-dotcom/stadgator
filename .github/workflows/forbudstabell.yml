# Månadskoll av förbudstabellen (verktyg/forbud-ovrig-tid.json).
#
# VAD DEN GÖR: kör verktyg/kolla-forbud-ovrig-tid.js. Stämmer allt händer ingenting.
# Har något ändrats öppnas ETT issue med rapporten i.
#
# VAD DEN INTE GÖR: den ändrar aldrig tabellen själv. Att läsa om en föreskrift och
# skriva om raden är ett beslut om vad appen påstår om verkligheten – det ska en
# människa se innan det går live. Kör `node verktyg/kolla-forbud-ovrig-tid.js
# --uppdatera` lokalt, granska diffen, och committa den som vanligt.
#
# TVÅ KONTROLLER, EN PER STAD. Göteborgs data är öppen och kör utan nyckel.
# Stockholms kräver `STHLM_API_KEY` under Settings → Secrets and variables → Actions.
# Saknas den avbryter BARA Stockholmssteget (exit 2) – Göteborgs rapport skrivs ändå
# och följer med i issuet. Nyckeln maskas i alla felutskrifter och når aldrig loggen.
name: Kolla datatabellerna

on:
  schedule:
    # Den 1:e varje månad 05:00 UTC. Föreskrifter ändras långsamt – uppmätt drift
    # är ungefär tre i månaden av 579, alltså 7 % om året. Tätare koll skulle bara
    # belasta Stockholms API utan att hitta något nytt.
    - cron: '0 5 1 * *'
  workflow_dispatch:        # går alltid att köra för hand

permissions:
  contents: read
  issues: write             # behövs bara för att öppna issuet nedan

jobs:
  kolla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # GÖTEBORG FÖRST, med flit: den behöver ingen nyckel. Saknas hemligheten
      # avbryter Stockholmssteget med kod 2, men Göteborgs rapport är redan skriven
      # och följer med i issuet – halva vakten är bättre än ingen.
      - name: Kör kontrollen (Göteborg – ingen nyckel behövs)
        id: gbg
        run: |
          set +e
          node verktyg/kolla-gbg-tabeller.js > rapport-gbg.txt 2>&1
          echo "kod=$?" >> "$GITHUB_OUTPUT"
          cat rapport-gbg.txt

      - name: Kör kontrollen (Stockholm)
        id: kolla
        env:
          STHLM_API_KEY: ${{ secrets.STHLM_API_KEY }}
        run: |
          set +e
          node verktyg/kolla-forbud-ovrig-tid.js > rapport.txt 2>&1
          echo "kod=$?" >> "$GITHUB_OUTPUT"
          cat rapport.txt

      # Exit 1 = något har ändrats. Exit 2 = kontrollen kunde inte köras (nyckel,
      # nätfel, tomt svar) – det är också värt ett issue, annars tystnar vakten
      # utan att någon märker det.
      - name: Öppna issue om något ändrats
        if: steps.kolla.outputs.kod != '0' || steps.gbg.outputs.kod != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const las = f => { try { return fs.readFileSync(f, 'utf8').trim(); } catch { return '(ingen rapport)'; } };
            const kodSthlm = '${{ steps.kolla.outputs.kod }}';
            const kodGbg   = '${{ steps.gbg.outputs.kod }}';
            const stad = [kodSthlm !== '0' ? 'Stockholm' : null, kodGbg !== '0' ? 'Göteborg' : null].filter(Boolean);
            const trasig = kodSthlm === '2' || kodGbg === '2';
            const rubrik = (trasig ? 'Datatabellerna kunde inte kontrolleras' : 'Datatabellerna behöver ses över')
                         + ' – ' + stad.join(' och ');
            const kropp = [
              trasig
                ? 'Minst en kontroll gick inte att köra. Det betyder INTE att allt är bra – ingen vet.'
                : 'Något stämmer inte längre med stadens data.',
              '',
              '## Stockholm (kod ' + kodSthlm + ')',
              '```', las('rapport.txt').slice(0, 30000), '```',
              '',
              '## Göteborg (kod ' + kodGbg + ')',
              '```', las('rapport-gbg.txt').slice(0, 30000), '```',
              '',
              '### Att göra – Stockholm',
              '1. `node verktyg/kolla-forbud-ovrig-tid.js --uppdatera`',
              '2. `node verktyg/bygg-forbud-ovrig-tid.js`',
              '3. Granska diffen – en rad som försvinner betyder att en gata slutar få rött.',
              '',
              '### Att göra – Göteborg',
              'Rapporten listar meningar utan rad. Bygg om tabellen det gäller',
              '(`las-gbg-lastplats.js` för lastplatser) och kör motsvarande `bygg-`-verktyg.',
              '',
              'Appen är säker under tiden. Stockholm: vakten ser att datumet inte stämmer och',
              'faller tillbaka. Göteborg: en okänd mening hittas inte, och då säger appen',
              '"vet inte" i stället för att tillämpa fel tider.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: rubrik + ' (' + new Date().toISOString().slice(0, 10) + ')',
              body: kropp,
              labels: ['data']
            });
